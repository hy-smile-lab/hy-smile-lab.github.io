# main 브랜치에 변경이 올라오면 자동으로 빌드해 GitHub Pages에 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 배포 경로 결정
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # 개인 도메인(public/CNAME) 또는 <계정>.github.io 저장소면 루트, 아니면 /저장소이름
          if [ -f public/CNAME ] || [[ "$REPO" == *.github.io ]]; then echo "NEXT_PUBLIC_BASE_PATH=" >> $GITHUB_ENV; else echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> $GITHUB_ENV; fi
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
